context: k3s-local
namespace: default
lima: k3s

vars:
  # Your Mac mini's IP as seen from inside the Lima VM.
  # Find it with: limactl shell k3s -- getent hosts host.lima.internal
  # Override in infra.local.yaml (gitignored).
  hostAliasIp: "0.0.0.0"

  # K8s event source.component value to trust for contact form notifications.
  # Override in infra.local.yaml (gitignored).
  k8sEventsSourceComponent: ""
