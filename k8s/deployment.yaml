apiVersion: v1
kind: ServiceAccount
metadata:
  name: joey-agent
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: joey-agent-event-watcher
  namespace: default
subjects:
- kind: ServiceAccount
  name: joey-agent
  namespace: default
roleRef:
  kind: ClusterRole
  name: event-watcher
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: joey-agent-claude-creds
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: joey-agent-mesh-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: joey-agent-workspace
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: joey-agent
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: joey-agent
  template:
    metadata:
      labels:
        app: joey-agent
    spec:
      serviceAccountName: joey-agent
      hostAliases:
      - ip: "192.168.5.2"
        hostnames:
        - "host.lima.internal"
      containers:
      - name: joey-agent
        image: local/joey-agent:9f60453-1788055032724
        imagePullPolicy: IfNotPresent
        envFrom:
        - secretRef:
            name: joey-agent-bot
            optional: true   # pod starts even if secret not yet created
        ports:
        - containerPort: 2222
          name: ssh
        - containerPort: 7979
          name: mesh
        volumeMounts:
        - name: claude-creds
          mountPath: /home/claude/.claude
        - name: mesh-data
          mountPath: /root/.mesh
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: claude-creds
        persistentVolumeClaim:
          claimName: joey-agent-claude-creds
      - name: mesh-data
        persistentVolumeClaim:
          claimName: joey-agent-mesh-data
      - name: workspace
        persistentVolumeClaim:
          claimName: joey-agent-workspace
---
apiVersion: v1
kind: Service
metadata:
  name: joey-agent-service
spec:
  type: NodePort
  selector:
    app: joey-agent
  ports:
  - port: 2222
    targetPort: 2222
    nodePort: 30022
    name: ssh
  - port: 7979
    targetPort: 7979
    nodePort: 30797
    name: mesh
